name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the job be invoked manually with a one-click trigger from the
  # Actions UI.
  workflow_dispatch:

concurrency:
  # Cancel in-progress runs for the same branch when new commits arrive.
  # The main branch is never cancelled, so release builds always complete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck-and-unit:
    name: Typecheck + Bun tests
    # macOS because the PTY tests spawn real shells and exercise macOS
    # ps/lsof output parsers. Linux would need additional shim
    # behavior we don't ship yet.
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        # eslint (flat config) over the project's authored TypeScript. The
        # config scopes out worktrees / generated bundles so this is fast
        # and meaningful; the tree is currently error- and warning-clean.
        run: bun run lint

      - name: Module-size ratchet
        # §3.6 (full_app_review_2026-08.md) — the four god modules all GREW
        # through a dedicated decomposition wave. One-off extractions don't
        # hold; a standing constraint does. Oversized files are baselined at
        # their current size and may shrink but never grow; a new file over
        # the cap fails outright. Re-baseline explicitly to record a
        # deliberate exception.
        run: bun run audit:module-size

      - name: Unit + integration tests
        # Don't run with DEBUG=* etc. — the noisy [session] / [web]
        # logs are already captured by bun:test on failure.
        run: bun test

  # P9 — coverage gate. Compares the freshly-generated lcov against
  # the Phase 0 baseline at tests/baselines/coverage-baseline.lcov.
  # Per-file ratio comparison with 0.5pp slack — no file may go
  # backwards. To lower the floor, run `bun run baseline:coverage`
  # locally and commit the new baseline (review-gated).
  coverage-gate:
    name: Coverage gate (per-file regression check)
    runs-on: macos-14
    timeout-minutes: 12
    # Don't block on the typecheck job — coverage is independent and
    # we'd rather see both pass/fail status in parallel.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate coverage
        # test:coverage runs the web-client build first (some tests
        # import bundled output) then bun test with lcov reporter.
        run: bun run test:coverage

      - name: Check coverage against baseline
        # Exits 1 if any file regressed beyond the 0.5pp slack.
        run: bun run report:coverage:check

  # H0c (full_app_review_2026-05.md) — the e2e suites were removed from CI
  # on 2026-04-27 for pixel-baseline flake, but that also took the
  # FUNCTIONAL web-mirror security specs (auth 401, cross-origin WS
  # rejection, protocol framing) offline. Those carry no screenshots, so
  # they're runner-stable. This job runs ONLY the top-level functional
  # specs; the pixel/design suite under tests-e2e/design/ stays out of the
  # PR path (run it nightly once thresholds + masking are tuned).
  e2e-functional:
    name: Functional e2e (web mirror)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Functional web-mirror e2e
        run: bun run test:e2e:functional

  # W4-2 (full_app_review_2026-05.md §18.3) — dependency vulnerability scan.
  # Non-blocking (continue-on-error) so a freshly-disclosed CVE in a
  # transitive dep INFORMS the PR without hard-failing it; pair with the
  # committed renovate.json which keeps deps current. Promote to blocking
  # once the dependency tree is known-clean.
  vuln-scan:
    name: Dependency vulnerability scan (non-blocking)
    runs-on: macos-14
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies (bun.lock)
        run: bun audit

  # The PIXEL/design e2e suites (native, packaged-app, screenshot-diff)
  # remain OFF the PR path: they were authored against pixel baselines that
  # drift on the GitHub runner's font smoothing / accent rendering. The
  # scripts remain on disk: `bun run test:native`,
  # `bun run test:native:packaged`, `bun run report:design`.
